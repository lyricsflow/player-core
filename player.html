  <title>LyricsFlow — Web Lyrics Player</title>
  <script>
    const isElectron = !!(window.wave?.windowControls || window.lyricsflow?.windowControls || (window.parent && (window.parent.wave || window.parent.lyricsflow)) || /electron/i.test(navigator.userAgent));
    const isInsideIframe = window.parent && window.parent !== window;
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    if (isElectron) {
      document.documentElement.classList.add('is-electron');
    } else {
      document.documentElement.classList.add('is-web');
    }

    if (isInsideIframe) {
      document.documentElement.classList.add('is-iframe');
    }

    if (isTouchDevice) {
      document.documentElement.classList.add('is-touch');
    }

    if (window.location.search.includes('embed=1')) {
      document.documentElement.classList.add('is-embed-mode');
    }
  </script>

  <!-- Premium Update Cache Detector -->
  <script>
    (function () {
      import('./js/router.js')
        .then(function (m) {
          if (!m.findTrackInPlaylist) {
            showCacheModal();
          }
        })
        .catch(function (e) {
          showCacheModal();
        });

      async function showCacheModal() {
        let title = 'Application Updated!';
        let desc = 'A premium new update has been installed! To apply these changes and prevent playlist errors, please clear your browser cache or perform a hard reload.';
        let reloadBtn = 'Reload Application';
        let dismissBtn = 'Dismiss';

        try {
          const i18n = await import('./js/i18n.js');
          if (i18n.t) {
            title = i18n.t('player_update_title');
            desc = i18n.t('player_update_desc');
            reloadBtn = i18n.t('player_reload_btn');
            dismissBtn = i18n.t('player_dismiss_btn');
          }
        } catch (e) { }

        const style = document.createElement('style');
        style.textContent = `
          @keyframes lyricsflowFadeIn { from { opacity: 0; } to { opacity: 1; } }
          @keyframes lyricsflowScaleUp {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
          }
          .lyricsflow-update-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 9999999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: lyricsflowFadeIn 0.3s ease forwards;
          }

    // ── Apple Music Sing (Separate Audio Track & Control) ──
    const pcBtnSing = document.getElementById('pc-btn-sing');
    const pcSingCapsule = document.getElementById('pc-sing-capsule');
    const pcSingTrack = document.getElementById('pc-sing-slider-track');
    const pcSingFill = document.getElementById('pc-sing-slider-fill');
    const pcSingThumb = document.getElementById('pc-sing-slider-thumb');

    let _singAudio = new Audio();
    _singAudio.preload = 'auto';
    _singAudio.volume = 0;
    let _singLevel = 0; // 0 = original song, 1 = max non-vocals (vocals eliminated)

    function setSingLevel(ratio) {
      _singLevel = Math.max(0, Math.min(1, ratio));
      if (pcSingFill) pcSingFill.style.height = `${_singLevel * 100}%`;
      if (pcSingThumb) pcSingThumb.style.bottom = `${_singLevel * 100}%`;
      _updateSingMix();
      if (_singLevel > 0.02) {
        pcBtnSing?.classList.add('active');
      } else {
        pcBtnSing?.classList.remove('active');
      }
    }

    function _updateSingMix() {
      const masterVol = player.getVolume ? player.getVolume() : (parseFloat(volumeSlider?.value) || 1);
      // As Sing level goes up: attenuate vocal audio, boost non-vocal audio
      const mainGain = Math.cos(_singLevel * 0.5 * Math.PI) * masterVol;
      const singGain = Math.sin(_singLevel * 0.5 * Math.PI) * masterVol;

      if (player.audio) player.audio.volume = Math.max(0, Math.min(1, mainGain));
      if (player.audioA) player.audioA.volume = Math.max(0, Math.min(1, mainGain));
      if (player.audioB) player.audioB.volume = Math.max(0, Math.min(1, mainGain));
      _singAudio.volume = Math.max(0, Math.min(1, singGain));
    }

    function syncSingAudio() {
      if (!_singAudio || !_singAudio.src) return;
      const mainAudio = player.audio || player.audioA || player.audioB;
      if (!mainAudio) return;
      const diff = Math.abs((_singAudio.currentTime || 0) - (mainAudio.currentTime || 0));
      if (diff > 0.08) {
        try { _singAudio.currentTime = mainAudio.currentTime; } catch (_) { }
      }
      if (mainAudio.paused && !_singAudio.paused) {
        _singAudio.pause();
      } else if (!mainAudio.paused && _singAudio.paused) {
        _singAudio.play().catch(() => { });
      }

        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>

          videoEl.onloadedmetadata = () => {
            const dur = videoEl.duration || 0;
            player.duration = dur * 1000;
            timeTotal.textContent = AudioPlayer.formatTime(dur, true);
            if (progressElastic) {
              progressElastic.dataset.max = String(Math.max(1, Math.round(dur)));
              progressElastic.dataset.step = '1000';
              setElasticValue(progressElastic, 0);

            hideTrackLoader();

          videoEl.ontimeupdate = () => {

              timeCurrent.textContent = AudioPlayer.formatTime(cur);
              timeTotal.textContent = AudioPlayer.formatTime(dur - cur, true);

          videoEl.onended = () => {

            goNextTrack();
          };

          player.play = () => videoEl.play();
          player.pause = () => videoEl.pause();
          player.togglePlay = () => {
            if (videoEl.paused) videoEl.play();
            else videoEl.pause();
            return !videoEl.paused;
          };
          player.seek = (ms) => {
            videoEl.currentTime = ms / 1000;
          };
          player.setVolume = (v) => {
            videoEl.volume = Math.max(0, Math.min(1, v));
          };
          player.getPosition = () => (videoEl.currentTime || 0) * 1000;

          songMetadata = {
            title: track.name || '',
            artist: track.artist || '',

            artUrl: track.artUrl || null,

          };
          window._lyricsflowSongMetadata = songMetadata;

            videoEl.play().catch(() => { });

          refreshQueue();
          hideTrackLoader();
          if (contentBox) contentBox.style.opacity = '1';
          return;
        } catch (vErr) {
          console.error("Failed to load video in player.html:", vErr);
        }
      } else {
        document.body.classList.remove('video-playing');
        if (player._activeVideoEl) {
          try { player._activeVideoEl.pause(); } catch (_) { }
          player._activeVideoEl = null;
        }
        delete player.play;
        delete player.pause;
        delete player.togglePlay;
        delete player.seek;
        delete player.setVolume;
        delete player.getPosition;
      }

      function isMP4Buffer(buf) {
        const view = new DataView(buf);
        if (view.byteLength < 12) return false;
        if (view.getUint8(4) === 0x66 && view.getUint8(5) === 0x74 &&
          view.getUint8(6) === 0x79 && view.getUint8(7) === 0x70) return true;
        const limit = Math.min(256, view.byteLength - 4);
        for (let i = 4; i < limit; i++) {
          if (view.getUint8(i) === 0x66 && view.getUint8(i + 1) === 0x74 &&
            view.getUint8(i + 2) === 0x79 && view.getUint8(i + 3) === 0x70) return true;
        }
        return false;
      }

      if (!track.buffer && track.amTrackId) {
        showNotice(`⬇️ ${t('loading_download')}`);
        try {
          const apiBase = window.API_BASE || 'https://api.spicyamll.online';

          let enableAlac = true;
          let enableDolby = true;
          try {
            const rawProf = localStorage.getItem('lyricsflow_user_profile');
            if (rawProf) {
              const p = JSON.parse(rawProf);
              if (p.enableAlac !== undefined) enableAlac = Boolean(p.enableAlac);
              if (p.enableDolby !== undefined) enableDolby = Boolean(p.enableDolby);
            }
          } catch (_) { }

          // Query official Apple Music catalog API for accurate audioTraits & direct albumId
          let fetchedTraits = Array.isArray(track.audioTraits) ? track.audioTraits : [];
          let directAlbumId = track.albumId || null;

          if (track.amTrackId) {
            try {
              const cacheKey = `am_cat_${track.amTrackId}`;
              let catData = null;
              try {
                const raw = sessionStorage.getItem(cacheKey);
                if (raw) catData = JSON.parse(raw);
              } catch (_) { }

              if (!catData) {
                const catRes = await fetch(`https://api.spicyamll.online/v1/catalog/kz/songs/${track.amTrackId}?art[url]=f&extend=lyricsExcerpt,offers&fields[albums]=artistName,artistUrl,artwork,name,url&fields[artists]=name,url&format[resources]=map&include=albums,artists,credits,lyrics,music-videos&l=en-US&platform=web`);
                if (catRes.ok) {
                  catData = await catRes.json();
                  try { sessionStorage.setItem(cacheKey, JSON.stringify(catData)); } catch (_) { }
                }
              }

              if (catData) {
                const songObj = catData.resources?.songs?.[String(track.amTrackId)] || catData.data?.[0];
                const attrs = songObj?.attributes || {};
                if (Array.isArray(attrs.audioTraits) && attrs.audioTraits.length > 0) {
                  fetchedTraits = attrs.audioTraits;
                  track.audioTraits = fetchedTraits;
                }
                const albData = songObj?.relationships?.albums?.data || catData.resources?.albums;
                if (Array.isArray(albData) && albData.length > 0 && albData[0].id) {
                  directAlbumId = albData[0].id;
                  track.albumId = directAlbumId;
                } else if (albData && typeof albData === 'object') {
                  const firstAlb = Object.values(albData)[0];
                  if (firstAlb?.id) {
                    directAlbumId = firstAlb.id;
                    track.albumId = directAlbumId;
                  }
                }
              }
            } catch (catErr) {
              console.warn('[CatalogTraits] Failed to fetch audioTraits:', catErr);
            }
          }

          // User specification: "atmos is atmos and spatial should be ignored, lossless is alac, lossy is aac or aac web"
          const trackHasDolby = fetchedTraits.some(t => typeof t === 'string' && t.toLowerCase() === 'atmos');
          const trackHasLossless = fetchedTraits.some(t => typeof t === 'string' && (t.includes('lossless') || t.includes('hi-res')));

          let codecChain = [];
          if (enableDolby && trackHasDolby) {
            codecChain.push('atmos');
          }
          if (enableAlac && trackHasLossless) {
            codecChain.push('alac');
          }
          codecChain.push('aac', 'aac-web');

          let currentCodecIdx = 0;
          const buildStreamUrl = (codec) => {
            let u = `${apiBase}/stream?song=${track.amTrackId}&codec=${codec}&fallback=false&l=en-US`;
            if (codec === 'atmos' || codec === 'alac') {
              u += '&websupport=true';
            }
            return u;
          };

          const updateActiveQualityBadge = (activeCodec) => {
            const badgeContainer = document.getElementById('quality-badge-container');
            const qualityText = document.getElementById('quality-badge-text');
            const qualityIcon = document.getElementById('quality-badge-icon');
            if (!badgeContainer || !qualityIcon || !qualityText) return;

            if (activeCodec === 'atmos') {
              qualityIcon.src = 'icons/dolby_atmos.svg';
              qualityIcon.style.display = 'inline-block';
              qualityText.textContent = '';
              qualityText.style.display = 'none';
              qualityIcon.style.width = '82px';
              qualityIcon.style.height = '18px';
              qualityIcon.style.marginRight = '0px';
              badgeContainer.style.display = 'flex';
              badgeContainer.classList.remove('hidden');
            } else if (activeCodec === 'alac') {
              qualityIcon.src = 'icons/lossless.svg';
              qualityIcon.style.display = 'inline-block';
              qualityText.style.display = 'inline';
              qualityText.textContent = t('player_quality_lossless') || 'Lossless';
              qualityIcon.style.width = '17px';
              qualityIcon.style.height = '14px';
              qualityIcon.style.marginRight = '4px';
              badgeContainer.style.display = 'flex';
              badgeContainer.classList.remove('hidden');
            } else {
              badgeContainer.style.display = 'none';
              badgeContainer.classList.add('hidden');
              qualityIcon.style.display = 'none';
              qualityText.style.display = 'none';
            }
          };

          window._activePlaybackCodec = codecChain[0];
          updateActiveQualityBadge(codecChain[0]);

          track.type = 'audio/mp4';
          fetch(`${apiBase}/download?song=${track.amTrackId}&l=en-US`)
            .then(res => res.ok ? res.arrayBuffer() : null)
            .then(async (buf) => {
              if (buf && buf.byteLength > 1000) {
                const db = await new Promise((res, rej) => {
                  const req = indexedDB.open('LyricsflowDB');
                  req.onsuccess = (e) => res(e.target.result);
                  req.onerror = (e) => rej(e.target.error);
                });
                const tx = db.transaction('buffers', 'readwrite');
                tx.objectStore('buffers').put(buf, track.id);
                track.buffer = buf;
              }
            })
            .catch(() => { });

          if (!isCrossfade) {
            parsedLyrics = null;
            window._lyricsflowCurrentLyrics = null;
            lyricsContent.innerHTML = '';
            lyricsType = 'None';
            if (sourceBadge) sourceBadge.textContent = '';
            showNotice(`⏳ ${t('player_loading_track')}`);

            albumArt.innerHTML = '';
            albumArt.className = 'MediaImageContainer';
            albumArt.style.backgroundImage = 'none';

            dynamicBg.innerHTML = '';
            dynamicBg.className = 'lyricsflow-dynamic-bg';
          }

          songMetadata = {
            title: track.name || '',
            artist: track.artist || '',
            album: track.album || '',
            artUrl: track.artUrl || null,
            year: track.year || (track.releaseDate ? formatLocalizedYear(track.releaseDate) : null),
            releaseDate: track.releaseDate || null,
            audioTraits: track.audioTraits || [],
            is_explicit: Boolean(track.is_explicit || track.contentRating === 'explicit'),
            songwriters: track.songwriters || []
          };
          window._lyricsflowSongMetadata = songMetadata;
          updateMetadataUI(songMetadata);
          fetchAnimatedArt(songMetadata.artist, songMetadata.album, songMetadata.title, directAlbumId);

          if (track.ttml && track.ttml !== '__AUTO_FETCH__') {
            try {
              parsedLyrics = parseTTMLToLyrics(track.ttml);
              window._lyricsflowCurrentLyrics = parsedLyrics;
              applyLyricsToUI(parsedLyrics);
              if (sourceBadge) sourceBadge.textContent = 'Lyrics: Apple Music (AMP)';
            } catch (err) {
              console.warn('AMP TTML parse failed, falling back to auto-fetch:', err);
              autoFetchLyrics(songMetadata, track.amTrackId);
            }
          } else {
            autoFetchLyrics(songMetadata, track.amTrackId);
          }

          player.onError = () => {
            currentCodecIdx++;
            if (currentCodecIdx < codecChain.length) {
              const nextCodec = codecChain[currentCodecIdx];
              window._activePlaybackCodec = nextCodec;
              updateActiveQualityBadge(nextCodec);
              console.warn(`[CodecFallback] Switching audio format to: ${nextCodec}`);
              showToast(`Switching to ${nextCodec.toUpperCase()}...`);
              if (songMetadata) updateMetadataUI(songMetadata);
              player.setSource(buildStreamUrl(nextCodec));
              if (autoPlay) player.play();
            } else {
              console.error("[CodecFallback] All stream codecs in fallback chain exhausted.");
              showToast(`❌ ${t('player_stream_failed')}`);
            }
          };

          player.onLoadedMetadata = (duration) => {
            timeTotal.textContent = AudioPlayer.formatTime(duration, true);
            if (progressElastic) {
              progressElastic.dataset.max = String(Math.max(1, Math.round(duration)));
              progressElastic.dataset.step = '1000';
              setElasticValue(progressElastic, 0);
            }
          };

          const streamUrl = buildStreamUrl(codecChain[0]);
          if (isCrossfade && player.crossfadeDuration > 0) {
            window._isCurrentTrackCrossfading = true;
            player.transitionTo(streamUrl, player.crossfadeDuration);
            setTimeout(() => {
              window._isCurrentTrackCrossfading = false;
            }, (player.crossfadeDuration || 3) * 1000);
          } else {
            window._isCurrentTrackCrossfading = false;
            player.setSource(streamUrl);
            if (autoPlay) player.play();
          }

          if (autoPlay) {
            updatePlayPauseIcon(true);
          } else {
            updatePlayPauseIcon(false);
          }
          refreshQueue();
          queueForceScroll();
          hideTrackLoader();
          if (contentBox) contentBox.style.opacity = '1';
          preloadQueueTracks();
          return;
        } catch (e) {
          console.error("Failed to stream track:", e);
          hideTrackLoader();
          showNotice(`❌ ${t('player_stream_failed')}: ${e.message}`);
          return;
        }
      }

      if (!isCrossfade) {
        parsedLyrics = null;
        window._lyricsflowCurrentLyrics = null;
        lyricsContent.innerHTML = '';
        lyricsType = 'None';
        if (sourceBadge) sourceBadge.textContent = '';
        showNotice(`⏳ ${t('player_loading_track')}`);

        albumArt.innerHTML = '';
        albumArt.className = 'MediaImageContainer';
        albumArt.style.backgroundImage = 'none';

        dynamicBg.innerHTML = '';
        dynamicBg.className = 'lyricsflow-dynamic-bg';
      }

      const blob = new Blob([track.buffer], { type: track.type });
      const url = URL.createObjectURL(blob);

      const processMetadata = async (duration) => {
        timeTotal.textContent = AudioPlayer.formatTime(duration, true);
        if (progressElastic) {
          progressElastic.dataset.max = String(Math.max(1, Math.round(duration)));
          progressElastic.dataset.step = '1000';
          setElasticValue(progressElastic, 0);
        }
        songMetadata = await parseAudioMetadata(track.buffer, track.name);
        window._activePlaybackCodec = null;
        window._lyricsflowSongMetadata = songMetadata;

        if (!songMetadata.album && track.album) {
          songMetadata.album = track.album;
        }
        if (!songMetadata.artist && track.artist) {
          songMetadata.artist = track.artist;
        }
        if (!songMetadata.title && track.name) {
          songMetadata.title = track.name.replace(/\.[^.]+$/, '');
        }
        if (track.is_explicit !== undefined) {
          songMetadata.is_explicit = Boolean(track.is_explicit);
        }

        updateMetadataUI(songMetadata);
        fetchAnimatedArt(songMetadata.artist, songMetadata.album, songMetadata.title);

        if (track.ttml && track.ttml !== '__AUTO_FETCH__') {
          try {
            showNotice(t('player_loading_lyrics'));
            await new Promise(r => setTimeout(r, 300));
            parsedLyrics = parseTTMLToLyrics(track.ttml);
            window._lyricsflowCurrentLyrics = parsedLyrics;
            applyLyricsToUI(parsedLyrics);
            if (sourceBadge) sourceBadge.textContent = "LYRICS: TTML";
          } catch (e) {
            console.error("Lyrics parse failed", e);
            showNotice(t('player_failed_parse_local'));
          }
        } else {
          autoFetchLyrics(songMetadata, track.amTrackId);
        }

        if (settingsManager.get('showSongwriters')) {
          const existingWriters = parsedLyrics?.SongWriters || [];
          GeniusService.fetchCredits(songMetadata, existingWriters).then(writers => {
            if (writers && writers.length > existingWriters.length) {
              if (parsedLyrics) {
                parsedLyrics.SongWriters = writers;
                const creditsEl = lyricsContent.querySelector('.Credits');
                if (creditsEl) {
                  creditsEl.textContent = `${t('player_written_by')}: ${writers.join(', ')}`;
                } else {
                  const scrollContainer = lyricsContent.querySelector('.LyricsflowScrollContainer');
                  if (scrollContainer) {
                    const newCredits = document.createElement('div');
                    newCredits.className = 'Credits';
                    newCredits.textContent = `${t('player_written_by')}: ${writers.join(', ')}`;
                    const spacer = scrollContainer.querySelector('.lyrics-spacer');
                    if (spacer) scrollContainer.insertBefore(newCredits, spacer);
                    else scrollContainer.appendChild(newCredits);
                  }
                }
              }
            }
          });
        }

        refreshQueue();
        queueForceScroll();
        checkFavoriteStatus();

        hideTrackLoader();
        if (contentBox) contentBox.style.opacity = '1';
        preloadQueueTracks();
      };

      return new Promise((resolve) => {
        let settled = false;

        const cleanup = () => {
          player.onError = null;
        };

        player.onLoadedMetadata = async (duration) => {
          if (settled) return;
          settled = true;
          cleanup();
          await processMetadata(duration);
          resolve();
        };

        player.onError = (err) => {
          if (settled) return;
          settled = true;
          cleanup();
          console.error('[loadTrack] Audio decode failed:', err ? { code: err.code, message: err.message } : 'Unknown error');
          hideTrackLoader();
          showNotice(t('player_track_failed'));
          setTimeout(() => {
            const next = getCurrentIndex() + 1;
            if (next < currentQueue.length) loadTrack(next);
          }, 1500);
          resolve();
        };

        setTimeout(() => {
          if (!settled) {
            settled = true;
            cleanup();
            console.error('[loadTrack] loadedmetadata timeout — audio element failed to decode');
            hideTrackLoader();
            showNotice(t('player_track_failed'));
            setTimeout(() => {
              const next = getCurrentIndex() + 1;
              if (next < currentQueue.length) loadTrack(next);
            }, 1500);
            resolve();
          }
        }, 15000);

        if (isCrossfade) {
          window._isCurrentTrackCrossfading = true;
          player.transitionTo(url, player.crossfadeDuration);
          setTimeout(() => {
            window._isCurrentTrackCrossfading = false;
          }, (player.crossfadeDuration || 3) * 1000);
        } else {
          window._isCurrentTrackCrossfading = false;
          player.setSource(url);
        }
      });
    }

    let _preloaderActive = false;
    async function preloadQueueTracks() {
      if (_preloaderActive || !currentQueue || currentQueue.length <= 1) return;
      _preloaderActive = true;

      try {
        const curIdx = getCurrentIndex();
        const order = [];
        for (let i = curIdx + 1; i < currentQueue.length; i++) order.push(i);
        if (curIdx - 1 >= 0) order.push(curIdx - 1);
        for (let i = 0; i < curIdx - 1; i++) order.push(i);

        for (const idx of order) {
          if (!currentQueue[idx]) continue;
          const trackInfo = currentQueue[idx];

          try {
            const track = await getTrackData(trackInfo.id);
            if (!track || track.buffer || !track.amTrackId || track.isVideo || track.videoUrl) continue;

            console.log(`[Preloader] Background caching track ${idx + 1}/${currentQueue.length}: ${track.name}`);
            const audioUrl = `https://api.spicyamll.online/download?song=${track.amTrackId}&l=${getCurrentLang()}`;
            const response = await fetch(audioUrl);
            if (response.ok) {
              const buf = await response.arrayBuffer();
              if (buf && buf.byteLength > 1000) {
                const db = await new Promise((res, rej) => {
                  const req = indexedDB.open('LyricsflowDB');
                  req.onsuccess = (e) => res(e.target.result);
                  req.onerror = (e) => rej(e.target.error);
                });
                await new Promise((res, rej) => {
                  const tx = db.transaction('buffers', 'readwrite');
                  const req = tx.objectStore('buffers').put(buf, track.id);
                  req.onsuccess = () => res();
                  req.onerror = () => rej(req.error);
                });
                track.buffer = buf;
                console.log(`[Preloader] Successfully cached: ${track.name}`);
              }
            }
          } catch (itemErr) {
            console.warn(`[Preloader] Failed to cache track at index ${idx}:`, itemErr);
          }
          await new Promise(r => setTimeout(r, 600));
        }
      } catch (e) {
        console.warn("[Preloader] Preloader queue cycle error:", e);
      } finally {
        _preloaderActive = false;
      }
    }

    function updateMetadataUI(metadata) {
      if (metadata.title) {
        songNameEl.querySelector('span').textContent = metadata.title;
        document.title = `LyricsFlow — ${metadata.title}`;
        songNameEl.classList.remove('rtl');
      }
      const explicitTag = document.getElementById('song-explicit-tag');
      if (explicitTag) {
        const isExplicit = Boolean(metadata.is_explicit || metadata.contentRating === 'explicit');
        explicitTag.style.display = isExplicit ? 'inline-flex' : 'none';
      }
      if (metadata.artist) {
        const rawYear = metadata.year || (metadata.releaseDate ? formatLocalizedYear(metadata.releaseDate) : "");
        const yearStr = (rawYear && settingsManager.get("releaseYearPosition") !== "Off") ? formatLocalizedYear(rawYear) : "";
        const yearPos = settingsManager.get("releaseYearPosition");
        const artistText = yearStr ? (yearPos === "Before Artist" ? `${yearStr} • ${metadata.artist}` : `${metadata.artist} • ${yearStr}`) : metadata.artist;

          albumArt.classList.add('crossfading');

            albumArt.style.backgroundImage = `url("${highResArt}")`;
            albumArt.style.opacity = '1';

          albumArt.style.opacity = '1';
          albumArt.style.backgroundImage = `url("${highResArt}")`;
        }

        extractColors(highResArt).then(async colors => {
          if (window._isCurrentTrackCrossfading) {

            dynamicBg.style.opacity = '0.4';

            dynamicBg.innerHTML = '';
            dynamicBg.className = 'lyricsflow-dynamic-bg';
            await applyLegacyBackground(dynamicBg, highResArt);
            dynamicBg.style.opacity = '1';
          } else {
            dynamicBg.style.transition = '';
            dynamicBg.style.opacity = '1';
            dynamicBg.innerHTML = '';
            dynamicBg.className = 'lyricsflow-dynamic-bg';
            await applyLegacyBackground(dynamicBg, highResArt);
          }
          setKawarpPlaybackState(!lyricsContainer.classList.contains('hidden'));
          if (colors.vibrant) document.documentElement.style.setProperty('--ArtworkGlowColor', colors.vibrant.join(', '));
        }).catch(e => console.warn('Color extraction failed:', e));
      } else {
        applyDefaultBackground(dynamicBg);
        albumArt.style.backgroundImage = 'none';
      }

      const nowBar = document.getElementById('now-bar');
      if (nowBar) {
        nowBar.setAttribute('data-album-name', metadata.album || '');
      }

      const badgeContainer = document.getElementById('quality-badge-container');
      const qualityText = document.getElementById('quality-badge-text');
      const qualityIcon = document.getElementById('quality-badge-icon');
      let badgeShown = false;
      const hasDolbyTrait = Array.isArray(metadata.audioTraits) && metadata.audioTraits.some(t => typeof t === 'string' && t.toLowerCase() === 'atmos');
      const hasHiResTrait = Array.isArray(metadata.audioTraits) && metadata.audioTraits.some(t => typeof t === 'string' && t.includes('hi-res'));
      const hasLosslessTrait = Array.isArray(metadata.audioTraits) && metadata.audioTraits.some(t => typeof t === 'string' && t.includes('lossless'));

      const activeCodec = window._activePlaybackCodec || (hasDolbyTrait ? 'atmos' : (hasLosslessTrait ? 'alac' : null));
      const isAAC = activeCodec === 'aac' || activeCodec === 'aac-web';

      if (!isAAC && activeCodec && qualityIcon && qualityText && !settingsManager.get('airPodsIcon')) {
        if (activeCodec === 'atmos' || (hasDolbyTrait && !window._activePlaybackCodec)) {
          qualityIcon.src = 'icons/dolby_atmos.svg';
          qualityIcon.style.display = 'inline-block';
          qualityText.textContent = '';
          qualityText.style.display = 'none';
          qualityIcon.style.width = '82px';
          qualityIcon.style.height = '18px';
          qualityIcon.style.marginRight = '0px';
          badgeShown = true;
        } else if (activeCodec === 'alac' || (hasLosslessTrait && !window._activePlaybackCodec)) {
          qualityIcon.src = 'icons/lossless.svg';
          qualityIcon.style.display = 'inline-block';
          qualityText.style.display = 'inline';
          qualityText.textContent = hasHiResTrait ? 'Hi-Res Lossless' : (t('player_quality_lossless') || 'Lossless');
          qualityIcon.style.width = '17px';
          qualityIcon.style.height = '14px';
          qualityIcon.style.marginRight = '4px';
          badgeShown = true;
        }
      }

      let audioQualityStr = 'AAC • 16-bit • 44.1kHz';
      if (!isAAC) {
        if (activeCodec === 'atmos' || (hasDolbyTrait && !window._activePlaybackCodec)) {
          audioQualityStr = 'Dolby Atmos';
        } else if (activeCodec === 'alac' || (hasLosslessTrait && !window._activePlaybackCodec)) {
          audioQualityStr = hasHiResTrait ? 'ALAC • 24-bit • 192.0kHz' : 'ALAC • 24-bit • 48.0kHz';
        }
      }
      _currentAudioQualityStr = audioQualityStr;

      if (badgeContainer) {
        badgeContainer.style.display = badgeShown ? 'flex' : 'none';
        badgeContainer.classList.toggle('hidden', !badgeShown);
      }
      if (!badgeShown) {
        if (qualityIcon) qualityIcon.style.display = 'none';
        if (qualityText) qualityText.style.display = 'none';
      }

      mediaSessionManager.updateMetadata(metadata.title, metadata.artist, metadata.album, metadata.artUrl, metadata.amTrackId || metadata.id, audioQualityStr);
    }

    async function autoFetchLyrics(metadata, amTrackId = null) {
      showNotice(t('player_finding_lyrics'));
      try {
        const durationSec = player.duration / 1000 || 0;
        const result = await retrieveTTML(metadata.title, metadata.artist, metadata.album, durationSec, amTrackId);
        if (result && result.lyricsData) {
          showNotice(t('player_loading_lyrics'));
          await new Promise(resolve => setTimeout(resolve, 300));

          result.lyricsData.makerHandle = result.makerHandle;
          result.lyricsData.makerId = result.makerId;
          result.lyricsData.makerDisplayName = result.makerDisplayName;
          result.lyricsData.makerNickname = result.makerNickname;
          result.lyricsData.makerAvatar = result.makerAvatar;

          parsedLyrics = cleanLyricsData(result.lyricsData);
          window._lyricsflowCurrentLyrics = parsedLyrics;
          applyLyricsToUI(parsedLyrics);
          if (sourceBadge) {
            sourceBadge.textContent = `Lyrics: ${result.sourceDisplayName || 'Auto-fetched'}`;
          }

          if (result.songId && !amTrackId) {
            const currentTrack = currentQueue[getCurrentIndex()];
            if (currentTrack) {
              console.log(`[Player] Saving found song ID ${result.songId} to IndexedDB`);
              updateTrackAmTrackId(currentTrack.id, result.songId);
              currentTrack.amTrackId = result.songId;
              document.getElementById('now-bar')?.setAttribute('data-am-track-id', result.songId);
            }
          }
        } else {
          showNotice(t('player_no_lyrics'));
        }
      } catch (err) {
        console.error("Auto-fetch error:", err);
        showNotice(t('player_could_not_fetch'));
      }
    }

    function cleanLyricsData(data) {
      if (!data || (!data.Content && !data.Lines)) return data;

      const isStatic = data.Type === 'Static';
      const lines = isStatic ? data.Lines : data.Content;
      const filteredLines = [];
      const writers = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const isSyllable = data.Type === 'Syllable';
        let text = line.Text || "";
        if (isSyllable && line.Lead && line.Lead.Syllables) {
          text = line.Lead.Syllables.map(s => s.Text).join("");
        }
        text = text || "";

        if (!text.trim() ||
          text.includes("作曲") || text.includes("作词") ||
          text.includes("编曲") || text.includes("制作人") ||
          text.includes("©") ||
          text.toLowerCase().includes("produced by")) continue;

        const writtenByMatch = text.match(/Written\s+by[:\s]+(.*)/i);
        if (writtenByMatch) {
          const names = writtenByMatch[1].trim();
          writers.push(...parseSongwriterString(names));
          break;
        }

        filteredLines.push(line);
      }

      if (isStatic) data.Lines = filteredLines;
      else data.Content = filteredLines;

      if (writers.length > 0) {
        data.SongWriters = (data.SongWriters || []).concat(writers);
      }

      return data;
    }

    function normalizeLyricText(str) {
      if (!str) return "";
      return str.toLowerCase().replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/[.,!?;:'"()[\]{}\-—–…@#$%^&*~`]/g, '').replace(/\s+/g, ' ').trim();
    }

    function applyLyricsToUI(lyrics) {
      if (!lyrics) return;

      let hasRomanization = false;
      let hasTranslation = false;

      const checkLineRoman = (l) => {
        const native = normalizeLyricText(l.Lead?.Syllables ? l.Lead.Syllables.map(s => s.Text || '').join('') : (l.Text || ''));
        if (l.RomanizedText && normalizeLyricText(l.RomanizedText) && normalizeLyricText(l.RomanizedText) !== native) return true;
        if (l.Lead?.Syllables && l.Lead.Syllables.some(s => s.RomanizedText && normalizeLyricText(s.RomanizedText) && normalizeLyricText(s.RomanizedText) !== normalizeLyricText(s.Text || ''))) return true;
        return false;
      };

      const checkLineTrans = (l) => {
        const native = normalizeLyricText(l.Lead?.Syllables ? l.Lead.Syllables.map(s => s.Text || '').join('') : (l.Text || ''));
        return !!(l.TranslatedText && normalizeLyricText(l.TranslatedText) && normalizeLyricText(l.TranslatedText) !== native);
      };

      if (lyrics.Content) {
        hasRomanization = lyrics.Content.some(checkLineRoman);
        hasTranslation = lyrics.Content.some(checkLineTrans);
      } else if (lyrics.Lines) {
        hasRomanization = lyrics.Lines.some(checkLineRoman);
        hasTranslation = lyrics.Lines.some(checkLineTrans);
      }

      const isRomanized = settingsManager.get("showRomanized");
      const isTranslated = settingsManager.get("showTranslation");

      const hasAnyTranslationFeature = hasRomanization || hasTranslation;
      if (pcBtnTranslationMenu) {
        pcBtnTranslationMenu.style.display = hasAnyTranslationFeature ? 'flex' : 'none';
        if (isRomanized || isTranslated) {
          pcBtnTranslationMenu.classList.add('active');
        } else {
          pcBtnTranslationMenu.classList.remove('active');
        }
      }

      if (btnMobileTranslationMenu) {
        if (hasAnyTranslationFeature) {
          btnMobileTranslationMenu.classList.add('has-feature');
        } else {
          btnMobileTranslationMenu.classList.remove('has-feature');
        }
        btnMobileTranslationMenu.style.display = '';
        if (isRomanized || isTranslated) {
          btnMobileTranslationMenu.classList.add('active');
        } else {
          btnMobileTranslationMenu.classList.remove('active');
        }
      }

      if (menuItemTranslation) {
        menuItemTranslation.style.display = hasTranslation ? 'flex' : 'none';
      }
      if (menuItemPronunciation) {
        menuItemPronunciation.style.display = hasRomanization ? 'flex' : 'none';
      }
      updateTranslationMenuUI(isTranslated, isRomanized);

      let typeToRender = lyrics.Type;
      if (typeToRender === 'Line') {
        typeToRender = 'Syllable';
      }

      lyricsType = typeToRender;
      if (lyricsNotice) lyricsNotice.style.display = 'none';

      if (typeToRender === 'Syllable') {
        const data = (lyrics.Type === 'Line')
          ? convertToSyllable(lyrics)
          : lyrics;
        applySyllableLyrics(data, lyricsContent);
      }
      else if (typeToRender === 'Static') applyStaticLyrics(lyrics, lyricsContent);

      initScrollManager(lyricsContent);
    }

    function showToast(text, duration = 2400) {
      const toast = document.getElementById('lyricsflow-toast');
      if (toast) {
        const toastText = toast.querySelector('.toast-text');
        if (toastText) toastText.textContent = text;
        toast.classList.add('active');
        clearTimeout(toast._timeout);

        loadTrack(0, true);

    const prevOnPlay = player.onPlay;
    player.onPlay = () => {
      setPlayButtonBuffering(false);
      updatePlayPauseIcon(true);
      if (!animationFrameId) startAnimationLoop();
      if (mediaSessionManager) mediaSessionManager.updatePlaybackState('playing');
      if (_singAudio && _singAudio.src) {
        try { _singAudio.currentTime = player.getPosition() / 1000; } catch (_) { }
        _singAudio.play().catch(() => { });
      }
      if (prevOnPlay) prevOnPlay();
    };

    const prevOnPause = player.onPause;
    player.onPause = () => {
      setPlayButtonBuffering(false);
      updatePlayPauseIcon(false);
      if (mediaSessionManager) mediaSessionManager.updatePlaybackState('paused');
      if (_singAudio) _singAudio.pause();
      if (prevOnPause) prevOnPause();
    };

    player.onWaiting = () => {
      setPlayButtonBuffering(true);
    };

    player.onCanPlay = () => {
      setPlayButtonBuffering(false);
    };

    const prevOnEnded = player.onEnded;
    player.onEnded = () => {
      if (mediaSessionManager) mediaSessionManager.updatePlaybackState('paused');
      if (_singAudio) _singAudio.pause();
      if (prevOnEnded) prevOnEnded();
      const nextIdx = getCurrentIndex() + 1;
      if (nextIdx < currentQueue.length) {
        loadTrack(nextIdx);
        player.play();
      } else if (player.repeatMode === 1) {
        loadTrack(0);
        player.play();
      } else {
        updatePlayPauseIcon(false);
      }

    function togglePlayback() {

    }

    function goPrevTrack() {
      const pos = player.getPosition();

    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('active');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));

      if (files.length > 0) {
        for (const file of files) {
          const reader = new FileReader();
          const buffer = await new Promise(r => {
            reader.onload = (ev) => r(ev.target.result);
            reader.readAsArrayBuffer(file);
          });

          const metadata = await parseAudioMetadata(buffer, file.name);

          await addTrackToQueue(buffer, {
            name: metadata.title || file.name,
            artist: metadata.artist || 'Unknown Artist',
            album: metadata.album || null,
            artUrl: metadata.artUrl || null,
            type: file.type || 'audio/mpeg',
            ttml: '__AUTO_FETCH__'

        await refreshQueue();

    const backBtn = document.getElementById('back-button');

        player.pause();

    window.addEventListener('message', async (e) => {
      if (e.origin !== window.location.origin && e.origin !== 'null' && window.location.origin !== 'null') {
        if (window.parent && e.source !== window.parent) return;
      }
      const data = e.data;
      if (!data) return;
      if (data.action === 'play') {
        player.play();
        updatePlayPauseIcon(true);
      } else if (data.action === 'pause') {
        player.pause();
        updatePlayPauseIcon(false);
      } else if (data.action === 'togglePlay') {
        if (player.isPlaying) {
          player.pause();
          updatePlayPauseIcon(false);
        } else {
          player.play();
          updatePlayPauseIcon(true);
        }
      } else if (data.action === 'seek' && typeof data.time === 'number') {
        player.seek(data.time);
        if (_singAudio) {
          try { _singAudio.currentTime = data.time / 1000; } catch (_) { }
        }
      } else if (data.action === 'loadTrack') {
        await refreshQueue();
        const autoPlay = data.autoPlay !== undefined ? !!data.autoPlay : true;
        await loadTrack(data.index || 0, false, autoPlay);
      } else if (data.action === 'next') {
        goNextTrack();
      } else if (data.action === 'prev') {
        goPrevTrack();
      } else if (data.action === 'switchView' && data.view) {
        setViewMode(data.view);
        if (data.view === 'lyrics') {
          if (pcBtnLyrics) pcBtnLyrics.classList.add('active');
          if (pcBtnQueue) pcBtnQueue.classList.remove('active');
        } else if (data.view === 'queue') {
          if (pcBtnQueue) pcBtnQueue.classList.add('active');
          if (pcBtnLyrics) pcBtnLyrics.classList.remove('active');
        }
      } else if (data.type === 'LYRICSFLOW_LOAD_DATA') {
        try {
          if (data.metadata && Array.isArray(data.metadata)) {
            const getMetaVal = (keyName) => {
              const item = data.metadata.find(m => m.key?.toLowerCase() === keyName.toLowerCase());
              if (!item) return '';
              return Array.isArray(item.value) ? item.value[0] || '' : (item.value || '');
            };
            const title = getMetaVal('title') || songMetadata.title || 'LyricsFlow Track';
            const artist = getMetaVal('artist') || songMetadata.artist || 'Apple Music';
            const album = getMetaVal('album') || songMetadata.album || '';
            songMetadata = {
              title,
              artist,
              album,
              artUrl: data.coverArt || songMetadata.artUrl || null
            };
            window._lyricsflowSongMetadata = songMetadata;
            updateMetadataUI(songMetadata);
            if (data.coverArt) {
              applyLegacyBackground(dynamicBg, data.coverArt).catch(() => {});
            }
          }

          if (Array.isArray(data.lyrics) && data.lyrics.length > 0) {
            const lines = data.lyrics.map(line => {
              const syllables = (line.words || []).map(w => ({
                Text: w.word || '',
                StartTime: (typeof w.startTime === 'number' ? w.startTime : 0) / 1000,
                EndTime: (typeof w.endTime === 'number' ? w.endTime : 0) / 1000,
                IsPartOfWord: !w.word?.endsWith(' ')
              }));
              return {
                StartTime: (typeof line.startTime === 'number' ? line.startTime : 0) / 1000,
                EndTime: (typeof line.endTime === 'number' ? line.endTime : 0) / 1000,
                OppositeAligned: !!line.isDuet,
                BGLine: !!line.isBG,
                Lead: {
                  StartTime: (typeof line.startTime === 'number' ? line.startTime : 0) / 1000,
                  EndTime: (typeof line.endTime === 'number' ? line.endTime : 0) / 1000,
                  Syllables: syllables
                },
                Text: (line.words || []).map(w => w.word || '').join(''),
                TranslatedText: line.translatedLyric || '',
                RomanizedText: line.romanLyric || ''
              };
            });

            const parsed = {
              Type: 'Syllable',
              StartTime: lines[0]?.StartTime ?? 0,
              Content: lines
            };
            parsedLyrics = parsed;
            window._lyricsflowCurrentLyrics = parsed;
            applyLyricsToUI(parsed);
          }

          hideTrackLoader();
          if (lyricsNotice) lyricsNotice.style.display = 'none';
          const contentBox = document.querySelector('.ContentBox');
          if (contentBox) contentBox.style.opacity = '1';
          setViewMode('lyrics');

          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'LYRICSFLOW_DATA_ACK' }, '*');
          }
        } catch (loadErr) {
          console.error('[LyricsFlow] Error loading data from editor:', loadErr);
        }
      } else if (data.type === 'LYRICSFLOW_TIME_UPDATE') {
        if (typeof data.currentTime === 'number' && Number.isFinite(data.currentTime)) {
          window._lyricsflowExternalTime = data.currentTime;
          window._lyricsflowExternalPlaying = !!data.isPlaying;
        }
      }
    });

    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'LYRICSFLOW_PLAYER_READY' }, '*');
    }

    let _currentAudioQualityStr = 'AAC • 16-bit • 44.1kHz';
    let _miniPlayerWin = null;
    const parentTargetOrigin = (window.location.origin && window.location.origin !== 'null') ? window.location.origin : '*';
    setInterval(() => {
      const isBuffering = !!(_currentLoader || (btnPlayPause && btnPlayPause.querySelector('.aero-spinner')?.style.display !== 'none'));
      const activeLyrics = window._lyricsflowCurrentLyrics || parsedLyrics || null;
      const statePayload = {
        type: 'player-state',
        isPlaying: player.isPlaying,
        isBuffering: isBuffering,
        position: player.getPosition ? player.getPosition() : 0,
        duration: player.duration || 0,
        audioQuality: _currentAudioQualityStr,
        songMetadata: songMetadata,
        lyricsData: activeLyrics,

      };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(statePayload, parentTargetOrigin);
      }
      if (_miniPlayerWin && !_miniPlayerWin.closed) {
        _miniPlayerWin.postMessage(statePayload, '*');
      }
      const desktopApi = window.wave || window.lyricsflow;
      if (desktopApi?.sendMiniState) {

    }, 250);

    const desktopApi = window.wave || window.lyricsflow;
    if (desktopApi?.onMiniAction) {

        if (command === 'togglePlay') {
          player.togglePlay();
        } else if (command === 'play') {
          player.play();
        } else if (command === 'pause') {
          player.pause();
        } else if (command === 'seek' && data && typeof data.time === 'number') {
          player.seek(data.time);
        } else if (command === 'next') {
          playNext();
        } else if (command === 'prev') {
          playPrev();
        } else if (command === 'shuffle') {
          if (btnShuffle) btnShuffle.click();
        } else if (command === 'repeat') {

        } else if (command === 'volume' && data && typeof data.volume === 'number') {

          updateVolumeSliderFill(data.volume);
          _updateSingMix();

    function updateVolumeSliderFill(val) {
      const gradient = `linear-gradient(to right, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.88) ${val * 100}%, rgba(255, 255, 255, 0.18) ${val * 100}%, rgba(255, 255, 255, 0.18) 100%)`;
      if (volumeSlider) volumeSlider.style.background = gradient;
      const pcSlider = document.getElementById('pc-volume-slider');
      if (pcSlider) pcSlider.style.background = gradient;

    const pcVolumeSlider = document.getElementById('pc-volume-slider');
    if (pcVolumeSlider) {
      const handleVolPointer = (e) => {
        const rect = pcVolumeSlider.getBoundingClientRect();
        if (rect.width <= 0) return;
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        pcVolumeSlider.value = ratio;
        player.setVolume(ratio);
        if (volumeSlider) volumeSlider.value = ratio;
        updateVolumeSliderFill(ratio);
        _updateSingMix();
      };
      pcVolumeSlider.addEventListener('pointerdown', handleVolPointer);

      pcVolumeSlider.oninput = (e) => {
        const val = parseFloat(e.target.value);
        player.setVolume(val);
        if (volumeSlider) volumeSlider.value = val;
        updateVolumeSliderFill(val);
        _updateSingMix();
      };
    }

    if (volumeSlider) {
      volumeSlider.addEventListener('pointerdown', (e) => {
        const rect = volumeSlider.getBoundingClientRect();
        if (rect.width <= 0) return;
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        volumeSlider.value = ratio;
        player.setVolume(ratio);
        if (pcVolumeSlider) pcVolumeSlider.value = ratio;
        updateVolumeSliderFill(ratio);
        _updateSingMix();
      });

      volumeSlider.oninput = (e) => {
        const val = parseFloat(e.target.value);

    if (btnQueue) {

    if (btnAirplay) {
      btnAirplay.onclick = async () => {

        if (navigator.mediaDevices && typeof navigator.mediaDevices.selectAudioOutput === 'function') {
          try {
            const device = await navigator.mediaDevices.selectAudioOutput();
            if (device && window.lyricsflowPlayer) {

      const localNowBarControls = document.querySelector('.NowBarControls');

      if (!localShuffle || !localRepeat || !localMetadataActions || !localNowBarControls) return;

      const isMobile = window.innerWidth <= 768;

      if (lyricsActive && isMobile) {

    function setViewMode(mode) {
      const isMobile = window.innerWidth <= 768;

      let firstRect = null;
      let firstMetaRect = null;
      const albumArtEl = document.getElementById('album-art') || document.querySelector('#LyricsflowPage .ContentBox .NowBar .Header .MediaBox');
      const metadataRow = document.querySelector('#LyricsflowPage .ContentBox .NowBar .Header .NowBarBottomWrapper .MetadataRow');

        firstRect = albumArtEl.getBoundingClientRect();

      if (isMobile && metadataRow) {
        firstMetaRect = metadataRow.getBoundingClientRect();
      }

      const isHidden = (mode !== 'lyrics');
      const isQueueActive = (mode === 'queue');

      if (isHidden) {
        lyricsContainer.classList.add('hidden');
        lyricsContainer.classList.remove('lyrics-immersive');
        document.body.classList.remove('lyrics-mode-active');

      if (isQueueActive) {

      const nowBarCentered = (mode === 'normal');

      const pcToggle = document.getElementById('pc-capsule-toggle');
      const pcLyr = document.getElementById('pc-btn-lyrics');

          const dX = firstRect.left - lastRect.left;
          const dY = firstRect.top - lastRect.top;
          const scale = firstRect.width / lastRect.width;

          albumArtEl.style.setProperty('transition', 'none', 'important');
          albumArtEl.style.setProperty('transform-origin', 'top left', 'important');
          albumArtEl.style.setProperty('transform', `translate3d(${dX}px, ${dY}px, 0) scale(${scale})`, 'important');

          albumArtEl.getBoundingClientRect(); // Commit initial inverted FLIP frame

          requestAnimationFrame(() => {
            albumArtEl.style.setProperty('transition', `transform ${appleSpring}, border-radius ${appleSpring}, box-shadow ${appleSpring}`, 'important');
            albumArtEl.style.setProperty('transform', 'translate3d(0, 0, 0) scale(1)', 'important');

            setTimeout(() => {
              albumArtEl.style.removeProperty('transition');
              albumArtEl.style.removeProperty('transform-origin');

        if (!isDraggingThumb) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;

        currentOffset = Math.max(0, Math.min(MAX_OFFSET, initialOffset + deltaX));
        pcCapsuleThumb.style.transform = `translate3d(${currentOffset.toFixed(1)}px, -3px, 0) scale3d(1.08, 1.15, 1)`;

      const onPointerUp = () => {
        if (!isDraggingThumb) return;
        isDraggingThumb = false;
        pcCapsuleToggle.classList.remove('is-dragging');
        pcCapsuleThumb.style.transform = '';

        document.removeEventListener('pointermove', onPointerMove);

        } else {

    function startAnimationLoop() {
      let fpsCount = 0, fpsStamp = performance.now();
      let lastUiUpdate = 0;
      const UI_INTERVAL = 100;

      function loop() {
        const nowMs = performance.now();
        fpsCount++;
        if (nowMs - fpsStamp >= 1000) {
          window.__lyricsflowFps = fpsCount;
          fpsCount = 0;
          fpsStamp = nowMs;
        }

        const pos = typeof window._lyricsflowExternalTime === 'number'
          ? window._lyricsflowExternalTime
          : (isDraggingProgress ? dragPosition : player.getPosition());
        const lyricsPos = typeof window._lyricsflowExternalTime === 'number'
          ? window._lyricsflowExternalTime
          : (isDraggingProgress ? dragPosition : player.getLatencyCompensatedPosition());
        const offset = settingsManager.get("playbackOffset") || 0;
        const adjustedLyricsPos = lyricsPos - offset;

        setLyricsTime(adjustedLyricsPos, lyricsType);
        setKawarpVolume(player.getLowFreqLevel());
        syncSingAudio();

        const doUi = isDraggingProgress || (nowMs - lastUiUpdate >= UI_INTERVAL);
        if (doUi) lastUiUpdate = nowMs;

        const nowBar = document.getElementById('now-bar');
        if (nowBar && doUi) {
          nowBar.setAttribute('data-position', pos.toString());
          nowBar.setAttribute('data-duration', (player.duration || 0).toString());
        }
        if (!document.hidden) {
          if (player.duration > 0 && doUi && !isDraggingProgress) {
            if (progressElastic) {
              if (String(Math.round(player.duration)) !== progressElastic.dataset.max) {
                progressElastic.dataset.max = String(Math.max(1, Math.round(player.duration)));
              }
              setElasticValue(progressElastic, Math.max(0, Math.min(pos, player.duration)));
            }
            timeTotal.textContent = AudioPlayer.formatTime(player.duration - pos, true);
          }
          if (doUi && !isDraggingProgress) {
            timeCurrent.textContent = AudioPlayer.formatTime(pos);
          }
          if (settingsManager.get('spicyLyricsAnimation')) {
            animateSpicyLyrics(adjustedLyricsPos, lyricsType, false);
          } else {
            animateLyrics(adjustedLyricsPos, lyricsType, false);
            scrollToActiveLine(lyricsContent, isDraggingProgress);
          }
        } else {
          if (settingsManager.get('spicyLyricsAnimation')) {
            animateSpicyLyrics(adjustedLyricsPos, lyricsType, true);
          } else {
            animateLyrics(adjustedLyricsPos, lyricsType, true);
          }
        }
        animationFrameId = requestAnimationFrame(loop);
      }
      animationFrameId = requestAnimationFrame(loop);
    }

    init();
    startAnimationLoop();
    btnOptions.onclick = () => settingsUI.show();

    const urlParamSettings = new URLSearchParams(window.location.search);
    if (urlParamSettings.get('openSettings') === '1' || urlParamSettings.get('openSettings') === 'true') {
      setTimeout(() => settingsUI.show(), 100);
    }
    window.addEventListener('message', (e) => {
      if (e.origin !== window.location.origin) return;
      if (e.data === 'openSettings' || e.data?.action === 'openSettings') {
        settingsUI.show();
      }
    });

    window.addEventListener('lyricsflow-settings-changed', () => {
      if (songMetadata) updateMetadataUI(songMetadata);
      resetSpicyLyrics();
      if (parsedLyrics) applyLyricsToUI(parsedLyrics);
      queueForceScroll();

      const sourceBadge = document.getElementById('lyrics-source-badge');
      if (sourceBadge) {
        sourceBadge.style.display = settingsManager.get('hideLyricsProvider') ? 'none' : 'block';
      }

      const qualityIcon = document.getElementById('quality-badge-icon');
      const qualityText = document.getElementById('quality-badge-text');
      const qualityBadgeContainer = document.getElementById('quality-badge-container');
      const curCodec = window._activePlaybackCodec;
      const isAacCodec = curCodec === 'aac' || curCodec === 'aac-web';
      const hasDolby = Array.isArray(songMetadata?.audioTraits) && songMetadata.audioTraits.some(t => typeof t === 'string' && t.toLowerCase() === 'atmos');
      const hasLossless = Array.isArray(songMetadata?.audioTraits) && songMetadata.audioTraits.some(t => typeof t === 'string' && (t.includes('lossless') || t.includes('hi-res')));

      const shouldShowBadge = !isAacCodec && (curCodec === 'atmos' || curCodec === 'alac' || hasDolby || hasLossless);

      if (qualityIcon && qualityText && qualityBadgeContainer) {
        if (!shouldShowBadge) {
          qualityBadgeContainer.style.display = 'none';
          qualityBadgeContainer.classList.add('hidden');
          qualityIcon.style.display = 'none';
          qualityText.style.display = 'none';
        } else if (settingsManager.get('dolbyAtmos') || curCodec === 'atmos' || hasDolby) {
          qualityIcon.src = 'icons/dolby_atmos.svg';
          qualityText.textContent = '';
          qualityText.style.display = 'none';
          qualityIcon.style.display = 'inline-block';
          qualityIcon.style.width = '82px';
          qualityIcon.style.height = '18px';
          qualityIcon.style.marginRight = '0px';
          qualityBadgeContainer.style.display = 'flex';
          qualityBadgeContainer.classList.remove('hidden');
        } else {
          qualityIcon.src = 'icons/lossless.svg';
          qualityText.style.display = 'inline';
          qualityIcon.style.display = 'inline-block';
          qualityText.textContent = t('player_quality_lossless') || 'Lossless';
          qualityIcon.style.width = '17px';
          qualityIcon.style.height = '14px';
          qualityIcon.style.marginRight = '4px';
          qualityBadgeContainer.style.display = 'flex';
          qualityBadgeContainer.classList.remove('hidden');
        }
      }

      updateBluetoothState();
    });

    window.dispatchEvent(new CustomEvent('lyricsflow-settings-changed', { detail: settingsManager.settings }));

    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayback();
      }
      if (e.code === 'ArrowLeft') {
        player.seek(Math.max(0, player.getPosition() - 5000));
        queueForceScroll();
      }
      if (e.code === 'ArrowRight') {
        player.seek(Math.min(player.duration, player.getPosition() + 5000));
        queueForceScroll();
      }
      if (e.key === 'VolumeUp' || e.code === 'VolumeUp' || e.key === 'AudioVolumeUp' || e.code === 'AudioVolumeUp') {
        e.preventDefault();
        const newVol = Math.min(1, player.getVolume() + 0.05);
        player.setVolume(newVol);
        volumeSlider.value = newVol;
        updateVolumeSliderFill(newVol);
        _updateSingMix();
      }
      if (e.key === 'VolumeDown' || e.code === 'VolumeDown' || e.key === 'AudioVolumeDown' || e.code === 'AudioVolumeDown') {
        e.preventDefault();
        const newVol = Math.max(0, player.getVolume() - 0.05);
        player.setVolume(newVol);
        volumeSlider.value = newVol;
        updateVolumeSliderFill(newVol);
        _updateSingMix();
      }
    }, { passive: false });
  </script>
