  <!-- Premium Update Cache Detector -->
  <script>
    (function () {
      import('./js/router.js')
        .then(function (m) {
          if (!m.findTrackInPlaylist) {
            showCacheModal();
          }
        })
        .catch(function (e) {
          showCacheModal();
        });

      async function showCacheModal() {
        let title = 'Application Updated!';
        let desc = 'A premium new update has been installed! To apply these changes and prevent playlist errors, please clear your browser cache or perform a hard reload.';
        let reloadBtn = 'Reload Application';
        let dismissBtn = 'Dismiss';

        try {
          const i18n = await import('./js/i18n.js');
          if (i18n.t) {
            title = i18n.t('player_update_title');
            desc = i18n.t('player_update_desc');
            reloadBtn = i18n.t('player_reload_btn');
            dismissBtn = i18n.t('player_dismiss_btn');
          }
        } catch (e) {}

        const style = document.createElement('style');
        style.textContent = `
          @keyframes lyricsflowFadeIn { from { opacity: 0; } to { opacity: 1; } }
          @keyframes lyricsflowScaleUp {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
          }
          .lyricsflow-update-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 9999999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: lyricsflowFadeIn 0.3s ease forwards;
          }
          .lyricsflow-update-box {
            background: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            animation: lyricsflowScaleUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
          }
          .lyricsflow-update-logo { font-size: 56px; margin-bottom: 20px; }
          .lyricsflow-update-title {
            font-size: 1.6rem; font-weight: 700; margin: 0 0 12px 0;
            background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          }
          .lyricsflow-update-desc {
            font-size: 0.95rem; color: rgba(255, 255, 255, 0.65);
            line-height: 1.5; margin: 0 0 25px 0;
          }
          .lyricsflow-update-btn {
            background: linear-gradient(135deg, #3a3a3c 0%, #1c1c1e 100%);
            color: white; border: none;
            padding: 14px 28px; border-radius: 14px;
            font-weight: 600; font-size: 0.95rem;
            cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
          }
          .lyricsflow-update-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(255, 255, 255, 0.25);
          }
          .lyricsflow-update-dismiss {
            background: transparent; color: rgba(255, 255, 255, 0.45);
            border: none; padding: 10px; margin-top: 10px;
            font-size: 0.85rem; cursor: pointer;
            text-decoration: underline; width: 100%;
            transition: color 0.2s;
          }
          .lyricsflow-update-dismiss:hover { color: #ffffff; }
        `;
        document.head.appendChild(style);

        const modal = document.createElement('div');
        modal.className = 'lyricsflow-update-modal';
        modal.id = 'lyricsflow-cache-detector-modal';
        modal.innerHTML = `
          <div class="lyricsflow-update-box">
            <div class="lyricsflow-update-logo"></div>
            <h2 class="lyricsflow-update-title">${title}</h2>
            <p class="lyricsflow-update-desc">
              ${desc}
            </p>
            <button class="lyricsflow-update-btn" onclick="window.location.reload(true)">${reloadBtn}</button>
            <button class="lyricsflow-update-dismiss" onclick="document.getElementById('lyricsflow-cache-detector-modal').remove()">${dismissBtn}</button>
          </div>
        `;
        document.body.appendChild(modal);
      }
    })();
  </script>

  <script type="module">
    import {
      hasPlayerData, getQueue, getTrackData, getCurrentIndex, setCurrentIndex,
      addTrackToQueue, updateQueueOrder, getTTMLContent, getAudioBlobUrl, getAudioName, isAutoFetchMode, goToUpload,
      updateTrackAmTrackId, getPlaylists, createPlaylist, addTrackToPlaylist, findTrackInPlaylist, removeTrackFromPlaylist
    } from './js/router.js';
    import parseTTMLToLyrics, { parseSongwriterString } from './js/ttml-parser.js';
    import { applySyllableLyrics, applyLineLyrics, applyStaticLyrics, LyricsObject, convertToSyllable } from './js/lyrics-applyer.js';
    import { setLyricsTime } from './js/lyrics-setter.js';
    import { animateLyrics } from './js/lyrics-animator.js';
    import { initScrollManager, scrollToActiveLine, resetScrollManager, queueForceScroll, isUserScrolling } from './js/scroll-manager.js';

    import AudioPlayer from './js/audio-player.js';
    import { applyDefaultBackground, applyLegacyBackground, extractColors, setKawarpPlaybackState, setKawarpVolume } from './js/dynamic-bg.js';
    import { parseAudioMetadata } from './js/metadata-parser.js';
    import { retrieveTTML } from './js/ttml-retriever.js';
    import { GeniusService } from './js/genius-service.js';
    import { settingsManager } from './js/settings-manager.js';
    import { settingsUI } from './js/settings-ui.js';
    import { getAnimatedArtwork, applyAnimatedArt } from './js/animated-art.js';
    import VideoExporter from './js/video-exporter.js';
    import { MediaSessionManager } from './js/media-session.js';
    import { escapeHTML, cleanArtworkUrl } from './js/security-utils.js';
    import extensionManager from './js/extensions.js';
    import { generateTTML } from './js/ttml-parser.js';
    import isRtl from './js/is-rtl.js';
    import { t, getCurrentLang, applyDOMTranslations, formatLocalizedDate, formatLocalizedYear } from './js/i18n.js';
    import {
      initElasticSlider, setElasticValue, getElasticValue
    } from 'https://nurislamaibekuly.github.io/aeroui/src/components/elastic-slider/elastic-slider.js';
    import {
      initPlayerButton, setPlayerIcon
    } from 'https://nurislamaibekuly.github.io/aeroui/src/components/player-button/player-button.js';
    import {
      initSkipLabel, playSkip
    } from 'https://nurislamaibekuly.github.io/aeroui/src/components/skip-label/skip-label.js';

    // ── Elements ──
    const lyricsContent = document.getElementById('lyrics-content');
    const lyricsNotice = document.getElementById('lyrics-notice');
    const songNameEl = document.getElementById('song-name');
    const artistsEl = document.getElementById('artists');
    const albumArt = document.getElementById('album-art');
    const dynamicBg = document.getElementById('dynamic-bg');

    const btnPlayPause = document.getElementById('btn-play-pause');
    const btnBackward = document.getElementById('btn-backward');
    const btnForward = document.getElementById('skip-forward');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnRepeat = document.getElementById('btn-repeat');
    const btnOptions = document.getElementById('btn-options');
    const btnQueue = document.getElementById('btn-queue');
    const shuffleIcon = document.getElementById('shuffle-icon');
    const repeatIcon = document.getElementById('repeat-icon');

    const queuePanel = document.getElementById('queue-panel');
    const playerQueueList = document.getElementById('player-queue-list');
    const queueClose = document.getElementById('queue-close');
    const queueClear = document.getElementById('queue-clear');

    const backButton = document.getElementById('back-button');
    const progressElastic = document.getElementById('progress-elastic');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const volumeSlider = document.getElementById('volume-slider');
    const sourceBadge = document.getElementById('lyrics-source-badge');
    const btnRomanization = document.getElementById('btn-romanization');
    const btnTranslation = document.getElementById('btn-translation');

    // ── State ──
    // Strictly enforce LTR mode on player.html at all times
    document.documentElement.dir = 'ltr';
    document.documentElement.setAttribute('dir', 'ltr');
    if (document.body) document.body.setAttribute('dir', 'ltr');
    window.addEventListener('lyricsflow-lang-changed', () => {
      document.documentElement.dir = 'ltr';
      document.documentElement.setAttribute('dir', 'ltr');
      if (document.body) document.body.setAttribute('dir', 'ltr');
    });

    let songMetadata = { title: '', artist: '', album: '', artUrl: null };
    const player = new AudioPlayer();
    window.lyricsflowPlayer = player;
    window.lyricsflowSettingsManager = settingsManager;
    window._lyricsflowCurrentLyrics = null;
    window._lyricsflowSongMetadata = songMetadata;
    window._lyricsflowGenerateTTML = generateTTML;
    settingsManager.apply();

    const mediaSessionManager = new MediaSessionManager(
      player,
      () => goNextTrack(),
      () => goPrevTrack()
    );
    let lyricsType = 'None';
    let parsedLyrics = null;
    let isDraggingProgress = false;
    let dragPosition = 0;
    let animationFrameId = null;
    let currentQueue = [];
    let previousLyricsSourceOrder = JSON.stringify(settingsManager.get("lyricsSourceOrder"));

    const videoExporter = new VideoExporter(player);
    window.addEventListener('lyricsflow-export-video', () => {
      videoExporter.startExport(songMetadata);
    });

    // Prompt for microphone permission once to unlock audio output device names
    function requestMicrophonePermission() {
      if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function') {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(stream => {
            // Stop the stream immediately so the microphone indicator doesn't stay on
            stream.getTracks().forEach(track => track.stop());
            updateBluetoothState();
          })
          .catch(err => {
            console.warn("Microphone permission denied; device labels will remain empty:", err);
            updateBluetoothState();
          });
      }
    }

    // ── TTML Test Listener ──
    window.addEventListener('lyricsflow_ttml_test_loaded', (e) => {
      const lyrics = e.detail;
      if (lyrics) {
        console.log('[TTML Tester] Applying test lyrics:', lyrics);
        parsedLyrics = lyrics;
        window._lyricsflowCurrentLyrics = lyrics;
        applyLyricsToUI(lyrics);
      }
    });

    // ── Init ──
    async function init() {
      // Check for test TTML in localStorage!
      const testDataStr = localStorage.getItem('lyricsflow_ttml_test');
      if (testDataStr) {
        try {
          const testData = JSON.parse(testDataStr);
          if (Date.now() - testData.timestamp < 30000) { // 30 sec expiry
            console.log('[TTML Tester] Loading test lyrics from localStorage');
            parsedLyrics = testData.lyrics;
            window._lyricsflowCurrentLyrics = testData.lyrics;
          }
          localStorage.removeItem('lyricsflow_ttml_test');
        } catch (e) {
          console.error('[TTML Tester] Error loading test data:', e);
        }
      }

      if (!(await hasPlayerData())) {
        window.location.href = 'index.html';
        return;
      }

      await extensionManager.loadFromStorage();
      extensionManager.loadAllExtensions();
      
      applyDOMTranslations();
      window.addEventListener('lyricsflow-lang-changed', (e) => {
        applyDOMTranslations();
        document.documentElement.lang = e.detail.lang;
        document.documentElement.dir = e.detail.dir;
      });

      showGlobalLoader();
      await refreshQueue();
      await loadTrack(getCurrentIndex());

      // Request mic permission to unlock device names (AirPods / Bluetooth)
      requestMicrophonePermission();

      // Default view mode on mobile: normal (centered cover art, no lyrics/queue)
      const isMobile = window.innerWidth <= 768;
      if (isMobile) {
        setViewMode('normal');
      } else {
        setViewMode('lyrics');
      }
    }

    function showGlobalLoader() {
      showTrackLoader();
    }

    async function refreshQueue() {
      currentQueue = await getQueue();
      renderQueue();
    }

    function renderQueue() {
      playerQueueList.innerHTML = '';
      const currentIndex = getCurrentIndex();
      const currentTrackId = currentQueue[currentIndex]?.id;

      currentQueue.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `player-queue-item ${index === currentIndex ? 'active' : ''}`;
        item.draggable = true;
        item.dataset.id = track.id;
        item.dataset.index = index;

        const safeName = escapeHTML(track.name.replace(/\.[^.]+$/, ''));
        const safeArtist = escapeHTML(track.artist || 'Unknown Artist');
        const safeArt = cleanArtworkUrl(track.artUrl || 'favicon.svg');

        item.innerHTML = `
          <div class="drag-handle" style="margin-right: 12px; opacity: 0.3;">≡</div>
          <div class="pq-art"></div>
          <div class="pq-info">
            <span class="pq-name">${safeName}</span>
            <span class="pq-artist">${safeArtist}</span>
          </div>
        `;
        const artEl = item.querySelector('.pq-art');
        if (artEl) {
          artEl.style.backgroundImage = `url("${safeArt || 'favicon.svg'}")`;
        }

        item.onclick = (e) => {
          if (e.target.classList.contains('drag-handle')) return;
          loadTrack(index);
        };

        // Drag Events
        item.addEventListener('dragstart', () => item.classList.add('dragging'));
        item.addEventListener('dragend', () => item.classList.remove('dragging'));

        playerQueueList.appendChild(item);
      });

      // Reordering logic
      playerQueueList.onsyncorder = async () => {
        const newIds = Array.from(playerQueueList.querySelectorAll('.player-queue-item')).map(el => parseInt(el.dataset.id));
        await updateQueueOrder(newIds);
        currentQueue = await getQueue();

        // Restore correct currentIndex for the playing track
        const newIdx = currentQueue.findIndex(t => t.id === currentTrackId);
        if (newIdx !== -1) setCurrentIndex(newIdx);

        renderQueue();
      };
    }

    playerQueueList.addEventListener('dragover', (e) => {
      e.preventDefault();
      const draggingEl = playerQueueList.querySelector('.dragging');
      const afterElement = getDragAfterElement(playerQueueList, e.clientY);
      if (afterElement == null) {
        playerQueueList.appendChild(draggingEl);
      } else {
        playerQueueList.insertBefore(draggingEl, afterElement);
      }
    });

    playerQueueList.addEventListener('drop', (e) => {
      e.preventDefault();
      if (playerQueueList.onsyncorder) playerQueueList.onsyncorder();
    });

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.player-queue-item:not(.dragging)')];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    let _currentLoader = null;

    function showTrackLoader() {
      if (_currentLoader) return;
      const loader = document.createElement('div');
      loader.className = 'LyricsflowLoader active';
      loader.innerHTML = '<div class="SlBounceLoader"></div>';
      document.body.appendChild(loader);
      _currentLoader = loader;
    }

    function hideTrackLoader() {
      if (!_currentLoader) return;
      _currentLoader.classList.remove('active');
      setTimeout(() => {
        if (_currentLoader && _currentLoader.parentNode) {
          _currentLoader.parentNode.removeChild(_currentLoader);
        }
        _currentLoader = null;
      }, 400);
    }

    async function loadTrack(index, isCrossfade = false) {
      if (index < 0 || index >= currentQueue.length) return;

      showTrackLoader();

      const contentBox = document.querySelector('.ContentBox');
      if (contentBox) contentBox.style.opacity = '0';

      // Short delay for fade out
      await new Promise(r => setTimeout(r, 340));

      setCurrentIndex(index);
      let track = await getTrackData(currentQueue[index].id);
      if (!track) {
        hideTrackLoader();
        if (contentBox) contentBox.style.opacity = '1';
        return;
      }
      const nowBar = document.getElementById('now-bar');
      if (nowBar) {
        nowBar.setAttribute('data-am-track-id', track.amTrackId || '');
        nowBar.setAttribute('data-art-url', track.artUrl || '');
      }

      function isMP4Buffer(buf) {
        const view = new DataView(buf);
        if (view.byteLength < 12) return false;
        // Standard position: ftyp at offset 4
        if (view.getUint8(4) === 0x66 && view.getUint8(5) === 0x74 &&
            view.getUint8(6) === 0x79 && view.getUint8(7) === 0x70) return true;
        // Some encoders prepend ID3v2 tags before the ftyp atom — scan first 256 bytes
        const limit = Math.min(256, view.byteLength - 4);
        for (let i = 4; i < limit; i++) {
          if (view.getUint8(i) === 0x66 && view.getUint8(i+1) === 0x74 &&
              view.getUint8(i+2) === 0x79 && view.getUint8(i+3) === 0x70) return true;
        }
        return false;
      }

      if (!track.buffer && track.amTrackId) {
        showNotice(`⬇️ ${t('loading_download')}`);
        try {
          const audioUrl = `https://api.spicyamll.online/download?song=${track.amTrackId}&l=${getCurrentLang()}`;
          const response = await fetch(audioUrl);
          if (!response.ok) throw new Error("HTTP " + response.status);
          const buf = await response.arrayBuffer();

          // Diagnostic: log what we actually received
          const hex = [...new Uint8Array(buf.slice(0, 32))].map(b => b.toString(16).padStart(2, '0')).join(' ');
          const textPreview = new TextDecoder().decode(buf.slice(0, 128));
          console.log(`[Download] ${track.amTrackId}: ${buf.byteLength} bytes, Content-Type: ${response.headers.get('content-type')}, first 32 bytes: ${hex}`);
          if (buf.byteLength < 1000 || textPreview.includes('{') || textPreview.includes('<')) {
            console.warn(`[Download] Suspicious content preview:`, textPreview.slice(0, 200));
          }

          // Open DB and save the buffer to cache it
          const db = await new Promise((res, rej) => {
            const req = indexedDB.open('LyricsflowDB');
            req.onsuccess = (e) => res(e.target.result);
            req.onerror = (e) => rej(e.target.error);
          });
          await new Promise((res, rej) => {
            const tx = db.transaction('buffers', 'readwrite');
            const req = tx.objectStore('buffers').put(buf, track.id);
            req.onsuccess = () => res();
            req.onerror = () => rej(req.error);
          });

          track.buffer = buf;
          // Prefer server Content-Type header over buffer sniffing for reliability
          const serverType = (response.headers.get('content-type') || '').toLowerCase();
          if (serverType.includes('mp4') || serverType.includes('m4a')) {
            track.type = 'audio/mp4';
          } else if (serverType.includes('mpeg') || serverType.includes('mp3')) {
            track.type = 'audio/mpeg';
          } else {
            track.type = isMP4Buffer(buf) ? 'audio/mp4' : 'audio/mpeg';
          }
        } catch (e) {
          console.error("Failed to stream track:", e);
          hideTrackLoader();
          showNotice(`❌ ${t('player_stream_failed')}: ${e.message}`);
          setTimeout(() => {
            const next = getCurrentIndex() + 1;
            if (next < currentQueue.length) loadTrack(next);
          }, 2000);
          return;
        }
      }

      // Reset UI
      parsedLyrics = null;
      window._lyricsflowCurrentLyrics = null;
      lyricsContent.innerHTML = '';
      lyricsType = 'None';
      if (sourceBadge) sourceBadge.textContent = '';
      showNotice(`⏳ ${t('player_loading_track')}`);

      albumArt.innerHTML = '';
      albumArt.className = 'MediaImageContainer';
      albumArt.style.backgroundImage = 'none';

      dynamicBg.innerHTML = '';
      dynamicBg.className = 'lyricsflow-dynamic-bg';

      const blob = new Blob([track.buffer], { type: track.type });
      const url = URL.createObjectURL(blob);

      const processMetadata = async (duration) => {
        timeTotal.textContent = AudioPlayer.formatTime(duration, true);
        if (progressElastic) {
          progressElastic.dataset.max = String(Math.max(1, Math.round(duration)));
          progressElastic.dataset.step = '1000';
          setElasticValue(progressElastic, 0);
        }
        songMetadata = await parseAudioMetadata(track.buffer, track.name);
        window._lyricsflowSongMetadata = songMetadata;

        if (!songMetadata.album && track.album) {
          songMetadata.album = track.album;
        }
        if (!songMetadata.artist && track.artist) {
          songMetadata.artist = track.artist;
        }
        if (!songMetadata.title && track.name) {
          songMetadata.title = track.name.replace(/\.[^.]+$/, '');
        }

        updateMetadataUI(songMetadata);
        fetchAnimatedArt(songMetadata.artist, songMetadata.album, songMetadata.title);

        if (track.ttml && track.ttml !== '__AUTO_FETCH__') {
          try {
            showNotice(t('player_loading_lyrics'));
            await new Promise(r => setTimeout(r, 300));
            parsedLyrics = parseTTMLToLyrics(track.ttml);
            window._lyricsflowCurrentLyrics = parsedLyrics;
            applyLyricsToUI(parsedLyrics);
            if (sourceBadge) sourceBadge.textContent = "LYRICS: TTML";
          } catch (e) {
            console.error("Lyrics parse failed", e);
            showNotice(t('player_failed_parse_local'));
          }
        } else {
          autoFetchLyrics(songMetadata, track.amTrackId);
        }

        if (settingsManager.get('showSongwriters')) {
          const existingWriters = parsedLyrics?.SongWriters || [];
          GeniusService.fetchCredits(songMetadata, existingWriters).then(writers => {
            if (writers && writers.length > existingWriters.length) {
              if (parsedLyrics) {
                parsedLyrics.SongWriters = writers;
                const creditsEl = lyricsContent.querySelector('.Credits');
                if (creditsEl) {
                  creditsEl.textContent = `${t('player_written_by')}: ${writers.join(', ')}`;
                } else {
                  const scrollContainer = lyricsContent.querySelector('.LyricsflowScrollContainer');
                  if (scrollContainer) {
                    const newCredits = document.createElement('div');
                    newCredits.className = 'Credits';
                    newCredits.textContent = `${t('player_written_by')}: ${writers.join(', ')}`;
                    const spacer = scrollContainer.querySelector('.lyrics-spacer');
                    if (spacer) scrollContainer.insertBefore(newCredits, spacer);
                    else scrollContainer.appendChild(newCredits);
                  }
                }
              }
            }
          });
        }

        refreshQueue();
        queueForceScroll();

        hideTrackLoader();
        if (contentBox) contentBox.style.opacity = '1';
        preloadNextTrack();
      };

      return new Promise((resolve) => {
        let settled = false;

        const cleanup = () => {
          player.onLoadedMetadata = null;
          player.onError = null;
        };

        player.onLoadedMetadata = async (duration) => {
          if (settled) return;
          settled = true;
          cleanup();
          await processMetadata(duration);
          resolve();
        };

        player.onError = (err) => {
          if (settled) return;
          settled = true;
          cleanup();
          console.error('[loadTrack] Audio decode failed:', err ? { code: err.code, message: err.message } : 'Unknown error');
          hideTrackLoader();
          showNotice(t('player_track_failed'));
          setTimeout(() => {
            const next = getCurrentIndex() + 1;
            if (next < currentQueue.length) loadTrack(next);
          }, 1500);
          resolve();
        };

        setTimeout(() => {
          if (!settled) {
            settled = true;
            cleanup();
            console.error('[loadTrack] loadedmetadata timeout — audio element failed to decode');
            hideTrackLoader();
            showNotice(t('player_track_failed'));
            setTimeout(() => {
              const next = getCurrentIndex() + 1;
              if (next < currentQueue.length) loadTrack(next);
            }, 1500);
            resolve();
          }
        }, 15000);

        if (isCrossfade) {
          player.transitionTo(url, player.crossfadeDuration);
        } else {
          player.setSource(url);
        }
      });
    }

    async function preloadNextTrack() {
      const nextIdx = getCurrentIndex() + 1;
      if (nextIdx < 0 || nextIdx >= currentQueue.length) return;

      try {
        const nextTrack = await getTrackData(currentQueue[nextIdx].id);
        if (!nextTrack) return;

        if (!nextTrack.buffer && nextTrack.amTrackId) {
          console.log(`[Preloader] Preloading next track in queue: ${nextTrack.name}`);
          const audioUrl = `https://api.spicyamll.online/download?song=${nextTrack.amTrackId}&l=${getCurrentLang()}`;
          const response = await fetch(audioUrl);
          if (!response.ok) throw new Error("HTTP " + response.status);
          const buf = await response.arrayBuffer();

          const db = await new Promise((res, rej) => {
            const req = indexedDB.open('LyricsflowDB');
            req.onsuccess = (e) => res(e.target.result);
            req.onerror = (e) => rej(e.target.error);
          });
          await new Promise((res, rej) => {
            const tx = db.transaction('buffers', 'readwrite');
            const req = tx.objectStore('buffers').put(buf, nextTrack.id);
            req.onsuccess = () => res();
            req.onerror = () => rej(req.error);
          });
          console.log(`[Preloader] Preloaded and cached: ${nextTrack.name}`);
        }
      } catch (e) {
        console.warn("[Preloader] Preload failed:", e);
      }
    }

    async function autoFetchLyrics(metadata, amTrackId = null) {
      showNotice(t('player_finding_lyrics'));
      try {
        const durationSec = player.duration / 1000 || 0;
        const result = await retrieveTTML(metadata.title, metadata.artist, metadata.album, durationSec, amTrackId);
        if (result && result.lyricsData) {
          showNotice(t('player_loading_lyrics'));
          await new Promise(resolve => setTimeout(resolve, 300));

          // Attach maker metadata for the credits renderer
          result.lyricsData.makerHandle = result.makerHandle;
          result.lyricsData.makerId = result.makerId;
          result.lyricsData.makerDisplayName = result.makerDisplayName;
          result.lyricsData.makerNickname = result.makerNickname;
          result.lyricsData.makerAvatar = result.makerAvatar;

          parsedLyrics = cleanLyricsData(result.lyricsData);
          window._lyricsflowCurrentLyrics = parsedLyrics;
          applyLyricsToUI(parsedLyrics);
          if (sourceBadge) {
            sourceBadge.textContent = `Lyrics: ${result.sourceDisplayName || 'Auto-fetched'}`;
          }

          // Save song ID to IndexedDB if it was found and not already saved
          if (result.songId && !amTrackId) {
            const currentTrack = currentQueue[getCurrentIndex()];
            if (currentTrack) {
              console.log(`[Player] Saving found song ID ${result.songId} to IndexedDB`);
              updateTrackAmTrackId(currentTrack.id, result.songId);
              currentTrack.amTrackId = result.songId; // Update in memory too
              document.getElementById('now-bar')?.setAttribute('data-am-track-id', result.songId);
            }
          }
        } else {
          showNotice(t('player_no_lyrics'));
        }
      } catch (err) {
        console.error("Auto-fetch error:", err);
        showNotice(t('player_could_not_fetch'));
      }
    }

    /**
     * Cleans and filters lyrics data (filters composer info, handles 'Written by').
     */
    function cleanLyricsData(data) {
      if (!data || (!data.Content && !data.Lines)) return data;

      const isStatic = data.Type === 'Static';
      const lines = isStatic ? data.Lines : data.Content;
      const filteredLines = [];
      const writers = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const isSyllable = data.Type === 'Syllable';
        let text = line.Text || "";
        if (isSyllable && line.Lead && line.Lead.Syllables) {
          text = line.Lead.Syllables.map(s => s.Text).join("");
        }
        text = text || "";

        // 1. Delete lines containing technical metadata or empty lines
        if (!text.trim() ||
          text.includes("作曲") || text.includes("作词") ||
          text.includes("编曲") || text.includes("制作人") ||
          text.includes("©") ||
          text.toLowerCase().includes("produced by")) continue;

        // 2. Handle "Written by"
        const writtenByMatch = text.match(/Written\s+by[:\s]+(.*)/i);
        if (writtenByMatch) {
          const names = writtenByMatch[1].trim();
          writers.push(...parseSongwriterString(names));
          // Truncate here (don't show "Written by" as a line, and stop processing further lines)
          break;
        }

        filteredLines.push(line);
      }

      if (isStatic) data.Lines = filteredLines;
      else data.Content = filteredLines;

      if (writers.length > 0) {
        data.SongWriters = (data.SongWriters || []).concat(writers);
      }

      return data;
    }

    function applyLyricsToUI(lyrics) {
      if (!lyrics) return;

      // Check if Romanization is available
      let hasRomanization = false;
      let hasTranslation = false;
      if (lyrics.Content) {
        hasRomanization = lyrics.Content.some(line => {
          if (line.RomanizedText) return true;
          if (line.Lead && line.Lead.Syllables) {
            return line.Lead.Syllables.some(s => s.RomanizedText);
          }
          return false;
        });
        hasTranslation = lyrics.Content.some(line => line.TranslatedText !== undefined);
      } else if (lyrics.Lines) {
        hasRomanization = lyrics.Lines.some(l => l.RomanizedText);
        hasTranslation = lyrics.Lines.some(l => l.TranslatedText !== undefined);
      }

      const isRomanized = settingsManager.get("showRomanized");
      const isTranslated = settingsManager.get("showTranslation");

      if (btnRomanization) {
        if (hasRomanization) {
          btnRomanization.style.display = 'flex';
          updateRomanizationBtnState(isRomanized);
        } else {
          btnRomanization.style.display = 'none';
        }
      }

      if (btnTranslation) {
        if (hasTranslation) {
          btnTranslation.style.display = 'flex';
          updateTranslationBtnState(isTranslated);
        } else {
          btnTranslation.style.display = 'none';
        }
      }

      let typeToRender = lyrics.Type;
      // Handle line lyrics as syllable/word lyrics
      if (typeToRender === 'Line') {
        typeToRender = 'Syllable';
      }

      lyricsType = typeToRender;
      if (lyricsNotice) lyricsNotice.style.display = 'none';

      if (typeToRender === 'Syllable') {
        const data = (lyrics.Type === 'Line')
          ? convertToSyllable(lyrics)
          : lyrics;
        applySyllableLyrics(data, lyricsContent);
      }
      else if (typeToRender === 'Static') applyStaticLyrics(lyrics, lyricsContent);

      initScrollManager(lyricsContent);
    }

    function showNotice(text) {
      if (lyricsNotice) {
        // Clear static/scrolled lyrics dynamic items
        lyricsContent.innerHTML = '';

        // Re-append notice element to ensure it's in the DOM
        lyricsContent.appendChild(lyricsNotice);

        lyricsNotice.style.display = '';
        lyricsNotice.querySelector('.notice-descriptor').textContent = text;

        const loaderGif = document.getElementById('lyrics-loader-gif');
        if (loaderGif) {
          // Show the loader GIF for finding/loading/searching notices
          if (text.includes('Finding') || text.includes('Loading') || text.includes('Searching')) {
            loaderGif.style.display = 'block';
          } else {
            loaderGif.style.display = 'none';
          }
        }
      }
    }

    async function fetchAnimatedArt(artist, album, title) {
      // Check if animated cover art is enabled in settings
      if (!settingsManager.get('coverArtAnimation')) {
        // Remove any existing animated art if the setting was just toggled off
        const existingVideo = albumArt?.querySelector('.animated-art-video');
        if (existingVideo) existingVideo.remove();
        return;
      }

      try {
        const videoUrl = await getAnimatedArtwork(artist, album, title);
        if (videoUrl) {
          applyAnimatedArt(albumArt, videoUrl);
        }
      } catch (e) {
        console.error('[AnimatedArt] Integration error:', e);
      }
    }

    // Listen for settings changes to remove animated art in real-time when toggled off
    window.addEventListener('lyricsflow-settings-changed', (e) => {
      if (!e.detail.coverArtAnimation) {
        const existingVideo = albumArt?.querySelector('.animated-art-video');
        if (existingVideo) existingVideo.remove();
        // Also remove background video
        const bgVideo = dynamicBg?.querySelector('video');
        if (bgVideo) {
          bgVideo.remove();
          dynamicBg.className = 'lyricsflow-dynamic-bg';
        }
      }

      // Check if provider order changed and refetch lyrics if needed
      const currentOrder = JSON.stringify(e.detail.lyricsSourceOrder);
      if (currentOrder !== previousLyricsSourceOrder) {
        previousLyricsSourceOrder = currentOrder;

        if (songMetadata && songMetadata.title) {
          console.log('[Player] Lyrics source order changed, refetching...');
          const currentTrack = currentQueue[getCurrentIndex()];
          autoFetchLyrics(songMetadata, currentTrack?.amTrackId);
        }
      }
    });

     // ── AirPods / AirPlay Bluetooth Detection ──
    async function updateBluetoothState() {
      const airplayIcon = document.getElementById('airplay-icon');
      const deviceNameEl = document.getElementById('airplay-device-name');
      if (!airplayIcon || !deviceNameEl) return;

      if (settingsManager.get('airPodsIcon')) {
        airplayIcon.src = 'icons/earphone.png';
        deviceNameEl.textContent = settingsManager.get('bluetoothDeviceName') || 'AirPods Pro';
        deviceNameEl.style.display = 'block';
        return;
      }

      let bluetoothName = null;
      let isBluetooth = false;

      try {
        if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioOutputs = devices.filter(d => d.kind === 'audiooutput');

          for (const device of audioOutputs) {
            const label = device.label ? device.label.toLowerCase() : '';
            if (
              label.includes('airpod') ||
              label.includes('bluetooth') ||
              label.includes('headphone') ||
              label.includes('earphone') ||
              label.includes('buds') ||
              label.includes('wireless') ||
              label.includes('hands-free') ||
              label.includes('audio') ||
              label.includes('hifi') ||
              label.includes('stereo')
            ) {
              if (label.includes('speaker') && !label.includes('bluetooth') && !label.includes('wireless')) {
                continue;
              }
              bluetoothName = device.label;
              isBluetooth = true;
              break;
            }
          }

          if (!isBluetooth && audioOutputs.length > 1) {
            isBluetooth = true;
          }
        }
      } catch (err) {
        console.warn("enumerateDevices failed:", err);
      }

      if (isBluetooth) {
        airplayIcon.src = 'icons/earphone.png';
        deviceNameEl.textContent = bluetoothName || 'Headphones';
        deviceNameEl.style.display = 'block';
      } else {
        airplayIcon.src = 'icons/airplay.png';
        deviceNameEl.textContent = '';
        deviceNameEl.style.display = 'none';
      }
    }

    if (navigator.mediaDevices) {
      navigator.mediaDevices.addEventListener('devicechange', updateBluetoothState);
    }
    // Listen to iOS webkit playback target changes on underlying audio elements
    if (player && player.audio) {
      player.audio.addEventListener('webkitplaybacktargetchange', updateBluetoothState);
    }
    if (player && player.audioA) {
      player.audioA.addEventListener('webkitplaybacktargetchange', updateBluetoothState);
    }
    if (player && player.audioB) {
      player.audioB.addEventListener('webkitplaybacktargetchange', updateBluetoothState);
    }
    setInterval(updateBluetoothState, 5000);
    updateBluetoothState();

    // ── Events ──
    player.onLoadedMetadata = (duration) => {
      timeTotal.textContent = AudioPlayer.formatTime(duration, true);
      if (progressElastic) {
        progressElastic.dataset.max = String(Math.max(1, Math.round(duration)));
        setElasticValue(progressElastic, 0);
      }
    };

    player.onCrossfadeTrigger = () => {
      const nextIdx = getCurrentIndex() + 1;
      if (nextIdx < currentQueue.length) {
        loadTrack(nextIdx, true);
      } else if (player.repeatMode === 1) { // Repeat All
        loadTrack(0, true);
      }
    };

    player.onEnded = () => {
      const nextIdx = getCurrentIndex() + 1;
      if (nextIdx < currentQueue.length) {
        loadTrack(nextIdx);
        player.play();
      } else if (player.repeatMode === 1) { // Repeat All
        loadTrack(0);
        player.play();
      } else {
        updatePlayPauseIcon(false);
      }
    };

    function togglePlayback() {
      const playing = player.togglePlay();
      updatePlayPauseIcon(playing);
      if (playing && !animationFrameId) startAnimationLoop();
    }

    function goNextTrack() {
      const next = getCurrentIndex() + 1;
      if (next < currentQueue.length) loadTrack(next);
    }

    function goPrevTrack() {
      const pos = player.getPosition();
      if (pos > 3000) {
        player.seek(0);
      } else {
        const prev = getCurrentIndex() - 1;
        if (prev >= 0) loadTrack(prev);
      }
    }

    // AeroUI player-button owns the press gesture and suppresses the native
    // click, so `pressend` (pointer / keyboard / assistive-tech) is the
    // single source of truth — do NOT also bind onclick (double-fire).
    if (btnPlayPause) {
      initPlayerButton(btnPlayPause);
      setPlayerIcon(btnPlayPause, 'play');
      btnPlayPause.addEventListener('pressend', togglePlayback);
    }
    if (btnForward) {
      initPlayerButton(btnForward);
      const skipFwd = btnForward.querySelector('.aero-skip');
      if (skipFwd) initSkipLabel(skipFwd);
      btnForward.addEventListener('pressend', () => {
        if (skipFwd) playSkip(skipFwd);
        goNextTrack();
      });
    }
    if (btnBackward) {
      initPlayerButton(btnBackward);
      const skipBack = btnBackward.querySelector('.aero-skip');
      if (skipBack) initSkipLabel(skipBack);
      btnBackward.addEventListener('pressend', () => {
        if (skipBack) playSkip(skipBack);
        goPrevTrack();
      });

    btnRepeat.onclick = () => {
      player.repeatMode = (player.repeatMode + 1) % 3;
      updateRepeatUI();
    };

    function updateRepeatUI() {
      if (player.repeatMode === 0) {
        repeatIcon.src = 'icons/repeat.svg';

      const isMobile = window.innerWidth <= 768;

      // 1. Measure First State (First)
      let firstRect = null;
      let firstMetaRect = null;
      const mediaBox = document.querySelector('#LyricsflowPage .ContentBox .NowBar .Header .MediaBox');
      const metadataRow = document.querySelector('#LyricsflowPage .ContentBox .NowBar .Header .NowBarBottomWrapper .MetadataRow');

      if (isMobile && mediaBox) {
        firstRect = mediaBox.getBoundingClientRect();
      }
      if (isMobile && metadataRow) {
        firstMetaRect = metadataRow.getBoundingClientRect();
      }

      const isHidden = (mode !== 'lyrics');
      const isQueueActive = (mode === 'queue');

      // Set class states
      if (isHidden) {
        lyricsContainer.classList.add('hidden');
        lyricsContainer.classList.remove('lyrics-immersive');
      } else {
        lyricsContainer.classList.remove('hidden');
        lyricsContainer.classList.add('lyrics-immersive');

      if (isQueueActive) {
        queuePanel.classList.add('active');
      } else {
        queuePanel.classList.remove('active');
        queuePanel.classList.remove('queue-immersive');
      }

      // Center now-bar only if neither is active
      const nowBarCentered = (mode === 'normal');
      nowBar.classList.toggle('centered', nowBarCentered);

      // Shift DOM layout for shuffle/repeat button location
      updateShuffleRepeatLocation(!nowBarCentered);

      // Update lyrics toggle icon

        lyricsIcon.src = (mode === 'lyrics') ? 'icons/lyricson.png' : 'icons/lyrics.png';
      }

      setKawarpPlaybackState(!isHidden);

      queueForceScroll();

      // 2. Measure Last State & Animate from Bottom-Right Corner (FLIP)
      if (isMobile && mediaBox && firstRect) {
        const lastRect = mediaBox.getBoundingClientRect();

        // Calculate size and position differences relative to bottom-right corner
        const dX = firstRect.right - lastRect.right;
        const dY = firstRect.bottom - lastRect.bottom;
        const dW = firstRect.width / lastRect.width;
        const dH = firstRect.height / lastRect.height;

        // Invert: Put element back in starting position relative to bottom-right
        mediaBox.style.transition = 'none';
        mediaBox.style.transformOrigin = 'bottom right';
        mediaBox.style.transform = `translate(${dX}px, ${dY}px) scale(${dW}, ${dH})`;

        // Force layout reflow
        mediaBox.offsetWidth;

        // Play: Smooth enlarging/shrinking from down right corner
        mediaBox.style.transition = 'transform 0.65s cubic-bezier(0.16, 1, 0.3, 1)';
        mediaBox.style.transform = 'none';

        // Clean up styles after animation completes
        setTimeout(() => {
          mediaBox.style.transition = '';
          mediaBox.style.transformOrigin = '';
          mediaBox.style.transform = '';
        }, 650);
      }

      if (isMobile && metadataRow && firstMetaRect) {
        const lastMetaRect = metadataRow.getBoundingClientRect();

        const dX = firstMetaRect.left - lastMetaRect.left;
        const dY = firstMetaRect.top - lastMetaRect.top;
        const dW = firstMetaRect.width / lastMetaRect.width;
        const dH = firstMetaRect.height / lastMetaRect.height;

        metadataRow.style.transition = 'none';
        metadataRow.style.transformOrigin = 'top left';
        metadataRow.style.transform = `translate(${dX}px, ${dY}px) scale(${dW}, ${dH})`;

        metadataRow.offsetWidth;

        metadataRow.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.2, 1)';
        metadataRow.style.transform = 'none';

        setTimeout(() => {
          metadataRow.style.transition = '';
          metadataRow.style.transformOrigin = '';
          metadataRow.style.transform = '';
        }, 600);
      }

        const delta = scrollTop - lyricsflowLastScrollTop;

        lyricsflowLastScrollTop = Math.max(0, scrollTop); // Bind positive for rubber-banding safe bounds

        const playlists = await getPlaylists();
        const favPlaylist = playlists.find(p => p.name === 'Favorites');
        if (favPlaylist) {

    function startAnimationLoop() {
      // FPS probe: window.__lyricsflowFps shows the real rAF rate on this page.
      let fpsCount = 0, fpsStamp = performance.now();

      // Progress bar / time text don't need 144 updates/s; 10 Hz is visually
      // identical and saves layout+paint every frame.
      let lastUiUpdate = 0;
      const UI_INTERVAL = 100;

      function loop() {
        const nowMs = performance.now();
        fpsCount++;
        if (nowMs - fpsStamp >= 1000) {
          window.__lyricsflowFps = fpsCount;
          fpsCount = 0;
          fpsStamp = nowMs;
        }

        const pos = isDraggingProgress ? dragPosition : player.getPosition();
        // Use latency-compensated position for lyrics so they sync to when audio is heard,
        // not when it's scheduled into the Web Audio pipeline (~200–300ms earlier).
        const lyricsPos = isDraggingProgress ? dragPosition : player.getLatencyCompensatedPosition();
        const offset = settingsManager.get("playbackOffset") || 0;
        const adjustedLyricsPos = lyricsPos - offset;

        setLyricsTime(adjustedLyricsPos, lyricsType);
        // Feed bass energy into the dybg background (volume-reactive twist/zoom)
        setKawarpVolume(player.getLowFreqLevel());

        const doUi = isDraggingProgress || (nowMs - lastUiUpdate >= UI_INTERVAL);
        if (doUi) lastUiUpdate = nowMs;

        const nowBar = document.getElementById('now-bar');
        if (nowBar && doUi) {
          nowBar.setAttribute('data-position', pos.toString());
          nowBar.setAttribute('data-duration', (player.duration || 0).toString());
        }
        if (!document.hidden) {
          if (player.duration > 0 && doUi && !isDraggingProgress) {
            if (progressElastic) {
              if (String(Math.round(player.duration)) !== progressElastic.dataset.max) {

            timeTotal.textContent = AudioPlayer.formatTime(player.duration - pos, true);

          if (doUi && !isDraggingProgress) {
            timeCurrent.textContent = AudioPlayer.formatTime(pos);
          }
          animateLyrics(adjustedLyricsPos, lyricsType, false);
          scrollToActiveLine(lyricsContent, isDraggingProgress);
        } else {
          animateLyrics(adjustedLyricsPos, lyricsType, true);
        }
        animationFrameId = requestAnimationFrame(loop);
      }
      animationFrameId = requestAnimationFrame(loop);
    }

        }
      }

      // Update AirPods / AirPlay / Bluetooth state
      updateBluetoothState();
    });

    // Apply settings on load
    window.dispatchEvent(new CustomEvent('lyricsflow-settings-changed', { detail: settingsManager.settings }));

    // ── Keyboard Shortcuts ──
    window.addEventListener('keydown', (e) => {
      // Don't trigger if typing in a text field, or if an AeroUI transport
      // button has focus (it already handles Space/Enter via pressend —
      // handling it here too would toggle twice).
      const tag = document.activeElement ? document.activeElement.tagName : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayback();
      }
      if (e.code === 'ArrowLeft') {
        player.seek(Math.max(0, player.getPosition() - 5000));
        queueForceScroll();
      }
      if (e.code === 'ArrowRight') {
        player.seek(Math.min(player.duration, player.getPosition() + 5000));
        queueForceScroll();
      }
      if (e.key === 'VolumeUp' || e.code === 'VolumeUp' || e.key === 'AudioVolumeUp' || e.code === 'AudioVolumeUp') {
        e.preventDefault();
        const newVol = Math.min(1, player.getVolume() + 0.05);
        player.setVolume(newVol);
        volumeSlider.value = newVol;
        updateVolumeSliderFill(newVol);
      }
      if (e.key === 'VolumeDown' || e.code === 'VolumeDown' || e.key === 'AudioVolumeDown' || e.code === 'AudioVolumeDown') {
        e.preventDefault();
        const newVol = Math.max(0, player.getVolume() - 0.05);
        player.setVolume(newVol);
        volumeSlider.value = newVol;
        updateVolumeSliderFill(newVol);
      }
    }, { passive: false });
  </script>

  <!-- Invisible touch shield — blocks accidental lyric seeks near the bottom -->
  <div class="touch-shield" id="touch-shield"></div>

  <!-- Bottom Bar -->
  <div class="BottomBar">
    <div class="bottom-bar-left">
      <button class="airplay-button" id="btn-airplay" title="AirPlay">
        <img src="icons/airplay.png" alt="AirPlay" id="airplay-icon">
        <span class="device-name" id="airplay-device-name" style="display: none;"></span>
      </button>
    </div>
    <div class="bottom-bar-right">
      <button class="lyrics-button" id="btn-lyrics" title="Lyrics">
        <img src="icons/lyricson.png" alt="Lyrics" id="lyrics-icon">
      </button>
      <button class="queue-button" id="btn-queue" title="Up Next">
                <img src="icons/queue.png" alt="Queue" id="queue-icon">
      </button>
    </div>
  </div>

  <!-- AirPlay Popup -->
  <div class="popup-overlay" id="airplay-popup" style="display: none;">
    <div class="popup-content">
      <p>hey this button doesnt do anything, its just there for aesthetics lmao</p>
      <button class="popup-close" id="btn-close-popup">Close</button>
    </div>
  </div>


  <!-- Apple Style Dynamic Toast -->
  <div class="LyricsflowToast" id="lyricsflow-toast">
    <span class="toast-text"></span>
  </div>
